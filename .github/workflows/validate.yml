name: Validate project

on:
  push:
  pull_request:

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        shell: bash
        run: bash -n scripts/*.sh
      - name: Run Python protocol tests
        run: python3 -m unittest discover -s tests -v
